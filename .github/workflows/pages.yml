name: Publicar WebApp no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Testar regras e permissões em PostgreSQL local
        run: pnpm test
      - name: Compilar aplicativo
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
