name: Verificação da ficha offline

on:
  push:
    branches:
      - feat/offline-first-ficha
  pull_request:
    branches:
      - feat/offline-first-ficha

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Diagnosticar encerramento dos testes por grupos
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(printf '%s\\n' tests/*.test.mjs | sort)
          batch_size=10
          total=${#test_files[@]}
          echo "Total de arquivos de teste: $total"
          for ((start=0; start<total; start+=batch_size)); do
            batch=("${test_files[@]:start:batch_size}")
            echo "::group::Grupo $((start / batch_size + 1)) — ${#batch[@]} arquivos"
            printf 'Arquivo: %s\\n' "${batch[@]}"
            timeout --signal=TERM --kill-after=10s 90s node --experimental-strip-types --experimental-sqlite --test "${batch[@]}"
            echo "::endgroup::"
          done

      - name: Validar build
        run: pnpm build
