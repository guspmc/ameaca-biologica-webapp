name: Verificação da ficha offline

on:
  push:
    branches:
      - feat/offline-first-ficha
  pull_request:
    branches:
      - feat/offline-first-ficha

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Diagnosticar encerramento dos testes por grupos
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(printf '%s\n' tests/*.test.mjs | sort)
          total=${#test_files[@]}
          failed=0
          echo "Total de arquivos de teste: $total"
          for ((index=0; index<total; index++)); do
            file="${test_files[index]}"
            echo "::group::Teste $((index + 1))/$total — $file"
            set +e
            timeout --signal=TERM --kill-after=10s 90s node --experimental-strip-types --experimental-sqlite --test "$file"
            result=$?
            set -e
            if [ "$result" -ne 0 ]; then
              echo "::error::Arquivo $file terminou com codigo $result"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Validar build
        run: pnpm build
