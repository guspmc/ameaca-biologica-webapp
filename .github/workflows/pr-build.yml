name: Validar compilação do WebApp

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: TypeScript e Vite
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Testar regras e permissões em PostgreSQL local
        run: pnpm test

      - name: Compilar aplicativo
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
